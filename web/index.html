<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Primary SEO -->
  <title>Ahmed Esam Abdelsalam — Junior Flutter Developer</title>
  <meta name="description" content="Junior Flutter Developer with 1+ year of experience delivering mobile applications across booking, delivery, social, e-commerce, healthcare and automotive domains. Skilled in BLoC/Cubit, Clean Architecture, and RESTful API integration.">
  <meta name="keywords" content="Junior Flutter Developer, Flutter Developer, Ahmed Esam, Mobile Apps, BLoC, Cubit, Clean Architecture, Firebase, Dart">
  <meta name="author" content="Ahmed Esam Abdelsalam">

  <!-- Open Graph / Social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ahmed Esam Abdelsalam — Junior Flutter Developer">
  <meta property="og:description" content="Junior Flutter Developer building mobile apps for booking, delivery, social, e-commerce, healthcare and automotive products — built with Clean Architecture and BLoC/Cubit.">
  <meta property="og:url" content="">
  <meta property="og:site_name" content="Ahmed Esam — Portfolio">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ahmed Esam Abdelsalam — Junior Flutter Developer">
  <meta name="twitter:description" content="Junior Flutter Developer building mobile apps for booking, delivery, social, e-commerce, healthcare and automotive products.">

  <!-- Theme color for browser chrome -->
  <meta name="theme-color" content="#2C3E50" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#E6E0F8" media="(prefers-color-scheme: light)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Esam — Flutter Dev">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <!-- The CanvasKit renderer is fetched from gstatic; open that connection
       while the bootstrap script is still loading. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>

  <style>
    /* Loading indicator — shown until Flutter mounts its first frame */
    body {
      margin: 0;
      background: #E6E0F8;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #2C3E50; }
    }
    .loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    .loader-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #BB8FCE;
      animation: pulse-loader 1.4s ease-in-out infinite;
    }
    .loader-dot:nth-child(1) { background: #A3E4D7; }
    .loader-dot:nth-child(2) { background: #BB8FCE; animation-delay: 0.16s; }
    .loader-dot:nth-child(3) { background: #2C3E50; animation-delay: 0.32s; }
    .loader-dot:nth-child(3) { animation-delay: 0.32s; }
    @keyframes pulse-loader {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Loading dots — removed by Flutter once the app renders -->
  <div class="loader" id="loading">
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
    <div class="loader-dot"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () { loader.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
