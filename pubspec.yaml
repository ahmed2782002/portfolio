name: portfolio
description: "Ahmed Esam Abdelsalam — Flutter Developer portfolio (Flutter Web)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Theme persistence (localStorage on web).
  shared_preferences: ^2.3.3
  # mailto: / tel: / https: launching from the contact section.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/profile/
    - assets/images/projects/book_iraq/
    - assets/images/projects/fresh_driver/
    - assets/images/projects/quartz/
    - assets/images/projects/yourseat/
    - assets/docs/

  fonts:
    # Display / headings — geometric grotesque with a technical character.
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

    # Body copy.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

    # Micro labels, indices, technology chips.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
